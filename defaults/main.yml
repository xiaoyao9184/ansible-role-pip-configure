---
pipconfig_dir: "~/.pip"
pipconfig_dir_mode: '0500'
pipconfig_extra_index_urls: []
pipconfig_file: "pip.conf"
pipconfig_file_mode: '0400'
pipconfig_find_links_urls: []
pipconfig_index_url: ""
pipconfig_timeout: 10

pipconfig_template_file: "pip.conf"

# Whether to upgrade pip
# This does not affect the use of templates to set up pip.conf
# It can be set `before` or `after`` running the pip config command.
pipconfig_pip_upgrade: none

# when level use '--site' path must be venv path,
# this directory will be inserted at the beginning of the PATH.
pipconfig_pip_virtualenv: ""
#
pipconfig_pip_cmd: "python3 -m pip"
# The global level will need to become
pipconfig_pip_level: user
#
pipconfig_pip_options: {}
  # global.index-url: https://pypi.example.com/simple
  # global.timeout: 100
  # install.extra-index-url: https://pypi.example.com/simple\nhttps://pypi.example.com/simple2
