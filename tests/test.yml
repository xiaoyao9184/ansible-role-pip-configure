---
- hosts: servers
  name: "Check defaults behave as expected."
  connection: local
  gather_facts: false
  vars_files:
    - vars/all.yml
  pre_tasks:
    - name: "Ensure {{ pipconfig_dir }} does not exist yet"
      stat:
        path: "{{ pipconfig_dir }}"
      register: config_dir_check
      failed_when: 'config_dir_check.stat.exists'

    - name: "Set find link urls patterns"
      set_fact:
        link_patterns: "{{ link_patterns | default([]) + [{'line': '        ' + item, 'pattern': '\\s{8}' + item}] }}"
      with_items:
         - "{{ links }}"
    - name: "Set extra index urls patterns"
      set_fact:
        extra_patterns: "{{ extra_patterns | default([]) + [{'line': '        ' + item, 'pattern': '\\s{8}' + item}] }}"
      with_items:
         - "{{ extras }}"

  roles:
    - role: "pip-configure"
      pipconfig_find_links_urls: "{{ links }}"
      pipconfig_extra_index_urls: "{{ extras }}"

  tasks:
    - name: "Get file stats"
      stat:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
      register: config_file_check
      failed_when: 'config_file_check is not success'

    - name: "Get dir stats"
      stat:
        path: "{{ pipconfig_dir }}"
      register: config_dir_check
      failed_when: 'config_dir_check is not success or config_dir_check.stat.mode != pipconfig_dir_mode'

    - name: "Assert '{{ pipconfig_file }}' does not contain index-url and url."
      lineinfile:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
        line: "index-url = {{ alt_index }}"
        state: absent
      register: findurl_lines_in_file_check
      failed_when: "findurl_lines_in_file_check.changed"

    - name: "Assert '{{ pipconfig_file }}' contains find-url and url."
      lineinfile:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
        line: "{{ item.line }}"
        regexp: "{{ item.pattern |default(item.line) }}"
        state: present
      with_items: "{{ [{'line': 'find-links =' }] + link_patterns }}"
      register: findurl_lines_in_file_check
      failed_when: "findurl_lines_in_file_check.changed"

    - name: "Assert '{{ pipconfig_file }}' contains extra-index-url and url."
      lineinfile:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
        line: "{{ item.line }}"
        regexp: "{{ item.pattern | default(item.line) }}"
        state: present
      with_items: "{{ [{'line': 'extra-index-url =' }] + extra_patterns }}"
      register: findurl_lines_in_file_check
      failed_when: "findurl_lines_in_file_check.changed"


- hosts: servers
  name: "Ensure overrides are effective."
  connection: local
  gather_facts: false
  vars_files:
    - vars/all.yml
  vars:
    pipconfig_dir: "{{ insecure_base_dir }}/.pip"
  pre_tasks:
    - name: "Ensure {{ pipconfig_dir }} does not exist yet"
      stat:
        path: "{{ pipconfig_dir }}"
      register: config_dir_check
      failed_when: 'config_dir_check.stat.exists'

    - name: "Create base directory"
      file:
        path: "{{ insecure_base_dir }}"
        mode: "0770"
        state: directory
    - name: "Set find link urls patterns"
      set_fact:
        link_patterns: "{{ link_patterns | default([]) + [{'line': '        ' + item, 'pattern': '\\s{8}' + item}] }}"
      with_items:
         - "{{ links }}"
    - name: "Set extra index urls patterns"
      set_fact:
        extra_patterns: "{{ extra_patterns | default([]) + [{'line': '        ' + item, 'pattern': '\\s{8}' + item}] }}"
      with_items:
         - "{{ extras }}"

  roles:
    - role: "pip-configure"
      pipconfig_index_url: "{{ alt_index }}"
      pipconfig_find_links_urls: "{{ links }}"
      pipconfig_extra_index_urls: "{{ extras }}"

  tasks:
    - name: "Get file stats"
      stat:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
      register: config_file_check
      failed_when: 'config_file_check is not success'

    - name: "Get dir stats"
      stat:
        path: "{{ pipconfig_dir }}"
      register: config_dir_check
      failed_when: 'config_dir_check is not success or config_dir_check.stat.mode != pipconfig_dir_mode'

    - name: "Assert '{{ pipconfig_file }}' contains index-url and url."
      lineinfile:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
        line: "index-url = {{ alt_index }}"
        state: present
      register: findurl_lines_in_file_check
      failed_when: "findurl_lines_in_file_check.changed"

    - name: "Assert '{{ pipconfig_file }}' contains extra-index-url and url."
      lineinfile:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
        line: "{{ item.line }}"
        regexp: "{{ item.pattern |default(item.line) }}"
        state: present
      with_items: "{{ [{'line': 'extra-index-url =' }] + extra_patterns }}"
      register: findurl_lines_in_file_check
      failed_when: "findurl_lines_in_file_check.changed"

    - name: "Assert '{{ pipconfig_file }}' contains extra-index-url and url."
      lineinfile:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
        line: "{{ item.line }}"
        regexp: "{{ item.pattern |default(item.line) }}"
        state: present
      with_items: "{{ [{'line': 'extra-index-url =' }] + extra_patterns }}"
      register: findurl_lines_in_file_check
      failed_when: "findurl_lines_in_file_check.changed"


- hosts: servers
  name: "Ensure exists directory override are effective."
  connection: local
  gather_facts: false
  vars_files:
    - vars/all.yml
  vars:
    pipconfig_dir: "{{ insecure_base_dir }}/exists-override"
  pre_tasks:
    - name: "Create config directory"
      file:
        path: "{{ pipconfig_dir }}"
        mode: "0755"
        state: directory

  roles:
    - role: "pip-configure"

  tasks:
    - name: "Get file stats"
      stat:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
      register: config_file_check
      failed_when: 'config_file_check is not success'

    - name: "Get dir stats"
      stat:
        path: "{{ pipconfig_dir }}"
      register: config_dir_check
      failed_when: 'config_dir_check is not success or config_dir_check.stat.mode != pipconfig_dir_mode'


- hosts: servers
  name: "Ensure exists directory skip is effective."
  connection: local
  gather_facts: false
  vars_files:
    - vars/all.yml
  vars:
    pipconfig_dir: "{{ insecure_base_dir }}/exists-skip"
    pipconfig_dir_mode: ""
  pre_tasks:
    - name: "Create config directory"
      file:
        path: "{{ pipconfig_dir }}"
        mode: "0700"
        state: directory

  roles:
    - role: "pip-configure"

  tasks:
    - name: "Get file stats"
      stat:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
      register: config_file_check
      failed_when: 'config_file_check is not success'

    - name: "Get dir stats"
      stat:
        path: "{{ pipconfig_dir }}"
      register: config_dir_check
      failed_when: 'config_dir_check is not success or config_dir_check.stat.mode == pipconfig_dir_mode'


- hosts: servers
  name: "Ensure the full file path without directory is available."
  connection: local
  gather_facts: false
  vars_files:
    - vars/all.yml
  vars:
    pipconfig_dir: ""
    pipconfig_dir_mode: ""
    pipconfig_file: "{{ insecure_base_dir }}/only-file/pip.conf"
  roles:
    - role: "pip-configure"

  tasks:
    - name: "Get file stats"
      stat:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
      register: config_file_check
      failed_when: 'config_file_check is not success'


- hosts: servers
  name: "Ensure use a custom template file."
  connection: local
  gather_facts: false
  vars_files:
    - vars/all.yml
  vars:
    pipconfig_dir: "{{ insecure_base_dir }}/custom-template"
    pipconfig_template_file: "{{ playbook_dir }}/pip.conf.j2"
    pipconfig_global_index_url: "https://custom-global-index.example.com/simple/"
    pipconfig_install_index_url: "https://custom-install-index.example.com/simple/"
  roles:
    - role: "pip-configure"

  tasks:
    - name: "Get file stats"
      stat:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
      register: config_file_check
      failed_when: 'config_file_check is not success'

    - name: "Get dir stats"
      stat:
        path: "{{ pipconfig_dir }}"
      register: config_dir_check
      failed_when: 'config_dir_check is not success or config_dir_check.stat.mode != pipconfig_dir_mode'

    - name: "Assert '{{ pipconfig_file }}' contain global index-url."
      community.general.ini_file:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
        section: global
        option: index-url
        value: "{{ pipconfig_global_index_url }}"
        state: present
      register: findurl_lines_in_file_check
      failed_when: findurl_lines_in_file_check.changed

    - name: "Assert '{{ pipconfig_file }}' contain install index-url."
      community.general.ini_file:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
        section: install
        option: index-url
        value: "{{ pipconfig_install_index_url }}"
        state: present
      register: findurl_lines_in_file_check
      failed_when: findurl_lines_in_file_check.changed


- hosts: servers
  name: "Ensure that use command set site config are available."
  connection: local
  # need to gather facts to get ansible_env.PATH
  gather_facts: true
  vars_files:
    - vars/all.yml
  vars:
    pipconfig_dir: "{{ insecure_base_dir }}/command-set"
    pipconfig_pip_virtualenv: "{{ pipconfig_dir }}/.venv"
    # pip version 19.1, there was no `--site` option; only `--venv` could be used.
    pipconfig_pip_level: venv
    pipconfig_pip_options:
      global.index-url: "https://command-global-index.example.com/simple/"
      install.index-url: "https://command-install-index.example.com/simple/\nhttps://command-install-index.example.com/simple2/"
  pre_tasks:
    - name: "Create config directory"
      file:
        path: "{{ pipconfig_dir }}"
        mode: "0777"
        state: directory

    - name: "Init venv {{ pipconfig_pip_virtualenv }}"
      shell:
        cmd: "python -m venv {{ pipconfig_pip_virtualenv }}"
      register: venv_dir_init

  roles:
    - role: "pip-configure"

  tasks:
    - name: "Get file stats"
      stat:
        path: "{{ pipconfig_dir }}/{{ pipconfig_file }}"
      register: config_file_check
      failed_when: 'config_file_check is not success'

    - name: "Get venv file stats"
      stat:
        path: "{{ pipconfig_dir }}/.venv/pip.conf"
      register: config_file_check
      failed_when: 'config_file_check is not success'

    - name: "Assert '{{ pipconfig_dir }}/.venv/pip.conf' contain global index-url."
      community.general.ini_file:
        path: "{{ pipconfig_dir }}/.venv/pip.conf"
        section: global
        option: index-url
        value: "{{ pipconfig_pip_options['global.index-url'] }}"
        state: present
      register: findurl_lines_in_file_check
      failed_when: findurl_lines_in_file_check.changed

